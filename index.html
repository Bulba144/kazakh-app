body {
    margin: 0;

    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    width: 100%;
    max-width: 420px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 20px;
    box-sizing: border-box;
}

.card {
    background: #1e1e2f;
    border-radius: 20px;
    padding: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
}

h2 {
    text-align: center;
    margin-bottom: 20px;
}

button {
    width: 100%;
    padding: 16px;
    margin-top: 12px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(90deg, #00adb5, #00ffcc);
    color: white;
    font-size: 16px;
    font-weight: bold;
}

button:active {
    transform: scale(0.96);
}

.selected {
    background: #ff9800 !important;
}

.progress {
    height: 8px;
    background: #333;
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 15px;
}

.progress-bar {
    height: 100%;
    background: linear-gradient(90deg, #00adb5, #00ffcc);
    width: 0%;
}

input {
    width: 100%;
    padding: 14px;
    box-sizing: border-box;
    border-radius: 12px;
    border: none;
    margin-top: 10px;
}

.message {
    margin-top: 10px;

}

function unlockSound(){
    if(!soundUnlocked){
        correctSound.volume = 0;
        wrongSound.volume = 0;

        correctSound.play().then(()=>{
            correctSound.pause();
            correctSound.currentTime = 0;
        }).catch(()=>{});

        wrongSound.play().then(()=>{
            wrongSound.pause();
            wrongSound.currentTime = 0;
        }).catch(()=>{});

function show(id){
    ["menu","tests","quiz","result"].forEach(el=>{
        document.getElementById(el).style.display="none";
    });
    document.getElementById(id).style.display="block";
}

function chooseLevel(level){
    currentLevel = level;
    let list = document.getElementById("testList");
    list.innerHTML = "";

    quizzes[level].forEach((_, index)=>{
        let btn = document.createElement("button");
        btn.innerText = "Тест " + (index+1);
        btn.onclick = ()=> startQuiz(level, index);
        list.appendChild(btn);
    });

    show("tests");
}

function startQuiz(level, index){
    currentTestIndex = index;
    currentQuestion = 0;
    score = 0;

    quizData = shuffle([...quizzes[level][index]]);
    startTime = Date.now();

    show("quiz");
    loadQuestion();
}

function startMixedQuiz(){

    currentQuestion = 0;
    score = 0;

    let allQuestions = [];

    Object.values(quizzes).forEach(level=>{
        level.forEach(test=>{
            test.forEach(q=>{
                allQuestions.push(q);
            });
        });
    });

    let unique = [];
    let seen = new Set();

    allQuestions.forEach(q=>{
        let key = q.q.trim().toLowerCase();
        if(!seen.has(key)){
            seen.add(key);
            unique.push(q);
        }
    });

    unique = shuffle(unique);

    quizData = unique.slice(0, 30);

    startTime = Date.now();

    show("quiz");
    loadQuestion();
}
  
function loadQuestion(){
    selectedAnswer = null;

    let msg = document.getElementById("message");
    msg.innerText = "";
    msg.style.color = "#ff6b6b";

    let q = quizData[currentQuestion];
    document.getElementById("question").innerText = q.q;
    document.getElementById("answers").innerHTML = "";
    document.getElementById("textAnswer").style.display = "none";

    if(q.type === "input"){
        document.getElementById("textAnswer").style.display = "block";
        document.getElementById("textAnswer").value = "";
    } else {
        let options = shuffle([...q.options]);

        options.forEach(opt=>{
            let btn = document.createElement("button");
            btn.innerText = opt;

            btn.onclick = ()=>{
                selectedAnswer = opt;
                document.querySelectorAll("#answers button").forEach(b=>b.classList.remove("selected"));
                btn.classList.add("selected");
            };

            document.getElementById("answers").appendChild(btn);
        });
    }

    document.getElementById("progress").style.width =
        ((currentQuestion)/quizData.length)*100 + "%";
}

function submitAnswer(){

    unlockSound();

    let q = quizData[currentQuestion];
    let answer;

    if(q.type === "input"){
        answer = document.getElementById("textAnswer").value;
        if(!answer.trim()){
            document.getElementById("message").innerText = "Введите ответ!";
            return;
        }
    } else {
        if(!selectedAnswer){
            document.getElementById("message").innerText = "Выберите вариант!";
            return;
        }
        answer = selectedAnswer;
    }

    let userAnswer = (answer + "").trim().toLowerCase();

    let isCorrect = false;

    if(Array.isArray(q.correct)){
        isCorrect = q.correct
            .map(a => a.toLowerCase())
            .includes(userAnswer);
    } else {
        isCorrect = q.correct.trim().toLowerCase() === userAnswer;
    }

    let buttons = document.querySelectorAll("#answers button");

    buttons.forEach(btn=>{
        let txt = btn.innerText.trim().toLowerCase();

        if(Array.isArray(q.correct)){
            if(q.correct.map(a=>a.toLowerCase()).includes(txt)){
                btn.style.background = "#4caf50";
            }
        } else {
            if(txt === q.correct.trim().toLowerCase()){
                btn.style.background = "#4caf50";
            }
        }

        if(txt === userAnswer && !isCorrect){
            btn.style.background = "#f44336";
        }
    });

    let msg = document.getElementById("message");

    if(isCorrect){
        score++;
        msg.innerText = "✅ Правильно!";
        msg.style.color = "#4caf50";
        correctSound.currentTime = 0;
        correctSound.play().catch(()=>{});
    } else {
        msg.innerText = "❌ Ошибка! Правильный ответ: " + (Array.isArray(q.correct) ? q.correct.join(", ") : q.correct);
        msg.style.color = "#f44336";
        wrongSound.currentTime = 0;
        wrongSound.play().catch(()=>{});
    }

    setTimeout(()=>{
        currentQuestion++;

        if(currentQuestion < quizData.length){
            loadQuestion();
        } else {
            showResult();
        }
    }, 2200);
}

function showResult(){
    let time = Math.floor((Date.now() - startTime)/1000);
    let percent = Math.round((score/quizData.length)*100);

    document.getElementById("score").innerText =
        "Правильно: " + score + "/" + quizData.length +
        " | " + percent + "%" +
        " | " + time + " секунд";

    show("result");
}

function restartQuiz(){
    startQuiz(currentLevel, currentTestIndex);
}

function goHome(){
    show("menu");
}

</script>
